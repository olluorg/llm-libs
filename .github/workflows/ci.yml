name: CI

# Быстрая проверка на каждом пуше и PR: сеть не нужна, всё работает на
# закоммиченном датасете. Полное обновление каталога — в refresh.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Данные и сайт
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Тесты чистых функций
        # Почти все ошибки этого проекта жили в чистых функциях: склейке
        # описаний, нормализации лицензий, приоритету полей при слиянии.
        # Идёт первым, потому что работает за сотню миллисекунд и может
        # остановить прогон до сети.
        run: npm test

      - name: Статическая проверка скриптов
        # Ловит «временную мёртвую зону» — const, объявленный ниже
        # верхнеуровневого await: ошибка проявляется только в рантайме.
        run: npm run lint

      - name: Проверка данных
        # validate проверяет в том числе, что ни одна курируемая запись
        # не потерялась, каталог не «схлопнулся», а роль и провайдеры
        # не противоречат друг другу.
        run: npm run validate

      - name: Сборка сайта
        run: npm run build
        env:
          SITE_URL: https://example.com

      - name: Дымовой тест сайта
        run: npm run check:site

      - name: Сводка по каталогу
        run: npm run stats

      - name: Артефакт собранного сайта
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: dist/
          retention-days: 7

      - name: Каталог в виде вложения
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: libraries-json
          path: data/out/libraries.json
          retention-days: 30

  audit:
    name: Аудит ссылок
    # Отдельная задача: ей нужен интернет (GitHub API) и токен, чтобы обойти
    # лимит 60 запросов в час. Проверяет, что ссылка на репозиторий в каждой
    # записи каталога жива и указывает на корень репозитория.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Проверка ссылок на репозитории
        # Битая ссылка в курируемой записи — ошибка данных, провал останавливает
        # CI. В автонайденной записи ссылка чинится следующим прогоном refresh.
        run: npm run audit:links

      - name: Отчёт об аудите
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-audit
          path: data/out/link-audit.json
          retention-days: 30
